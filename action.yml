name: 'Veracode scan results to GitHub issues Action'
description: 'Import the results of a Veracode scan as Issues for a repo or Azure DevOps work items'
inputs:
  dts_type:
    description: 'Type of defect tracking system to use (GITHUB or ADO)'
    required: false
    default: 'GITHUB'
  scan-results-json:
    description: 'Scan results file (required if profile-name/sandbox-name not provided, ignored if profile-name/sandbox-name is provided)'
    required: false
    default: 'filtered_results.json'
  profile-name:
    description: 'Veracode application profile name (alternative to scan-results-json)'
    required: false
  sandbox-name:
    description: 'Veracode sandbox name (alternative to scan-results-json, requires profile-name)'
    required: false
  veracode-api-id:
    description: 'Veracode API ID (required if profile-name or sandbox-name is provided)'
    required: false
  veracode-api-key:
    description: 'Veracode API Key (required if profile-name or sandbox-name is provided)'
    required: false
  github-token:
    description: 'GitHub token to access the repo'
    default: ${{ github.token }}
    required: true
  wait-time:
    description: 'Delay (in seconds) between entering Issues into GitHub (due to rate limiting)'
    required: false
    default: '2'
  source_base_path_1:
    description: 'Rewrite 1'
    required: false
  source_base_path_2:
    description: 'Rewrite 2'
    required: false
  source_base_path_3:
    description: 'Rewrite 3'
    required: false
  repo_owner:
    description: 'repo owner'
    required: false
  fail_build:
    description: fail pipeline upon findings (true | false)
    required: false
  autoCloseFindings:
    description: 'Automatically close issues/work items that are no longer present in scan results (true | false)'
    required: false
    default: 'false'
  debug:
    description: enable debug logging
    required: false
  commitHash:
    description: commit hash
    required: false
  repo_name:
    description: repo name
    required: false
  ADO_PAT:
    description: 'Azure DevOps Personal Access Token'
    required: false
  ADO_ORG:
    description: 'Azure DevOps Organization'
    required: false
  ADO_PROJECT:
    description: 'Azure DevOps Project'
    required: false
  ADO_WORK_ITEM_TYPE:
    description: 'Azure DevOps Work Item Type (Bug, Issue)'
    required: false
    default: 'Issue'
  ADO_OPEN_STATE:
    description: 'Azure DevOps state for new work items (default: "To Do" for Issue, "New" for Bug)'
    required: false
    default: 'To Do'
  ADO_CLOSE_STATE:
    description: 'Azure DevOps state for closed work items (default: "Done" for Issue, "Closed" for Bug)'
    required: false
    default: 'Done'
  ADO_REOPEN_STATE:
    description: 'Azure DevOps state for reopened work items (default: "To Do" for Issue, "New" for Bug)'
    required: false
    default: 'To Do'

runs:
  using: 'node20'
  main: 'index.js'
